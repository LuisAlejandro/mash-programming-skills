[bumpversion]
current_version = 0.5.14
commit = True
tag = True
tag_name = {new_version}

# The project version lives in exactly one file. `VERSION` is the canonical
# source: install.sh reads it at runtime (`./install.sh --version`) and no other
# tracked file embeds the version literal, so this is the whole version surface.
#
# No post-bump step is needed, so there is no [maintainer-tools] section here.

[bumpversion:file:VERSION]
